{% extends "base.html" %}
{% block title %}Upload Instruction{% endblock %}
{% block content %}
<section class="card narrow">
    <h2>Upload Instruction PDF</h2>
    <p class="muted">Only staff users can upload instruction documents.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
</section>
{% endblock %}
