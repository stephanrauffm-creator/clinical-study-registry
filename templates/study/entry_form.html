{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<section class="card narrow">
    <h2>{{ page_title }}</h2>
    <p class="muted">All records must stay pseudonymized (PIZ only).</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ submit_label }}</button>
    </form>
</section>
{% endblock %}
